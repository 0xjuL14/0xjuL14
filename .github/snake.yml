name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # roda todo dia às 00:00 UTC
  workflow_dispatch:      # permite rodar manualmente

permissions:
  contents: write         # necessário para dar push na branch "output"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: 0xjuL14
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#7fff00&color_dots=#161b22,#3b1d6e,#6d2fc4,#a855f7,#d8b4fe
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#7fff00&color_dots=#161b22,#3b1d6e,#6d2fc4,#a855f7,#d8b4fe

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
